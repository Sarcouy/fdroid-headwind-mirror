[project]
name = "fdroid-headwind-mirror"
version = "0.4.0"
description = "Synchronise F-Droid application updates to Headwind MDM"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx (>=0.28,<0.29)",
    "pydantic (>=2.10,<3.0)",
    "pydantic-settings (>=2.7,<3.0)",
    "typer (>=0.15,<0.16)",
    # click 8.2 removes CliRunner(mix_stderr=...), on which the stdout/stderr
    # separation checked by the CLI tests depends.
    "click (>=8.1,<8.2)",
    "structlog (>=24.4,<25.0)",
    "pyyaml (>=6.0,<7.0)",
]

[project.scripts]
fhm = "fdroid_headwind_mirror.cli:app"

[tool.poetry]
packages = [{ include = "fdroid_headwind_mirror" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pylint = "^3.3"
black = "^24.10"
types-pyyaml = "^6.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
# The pattern must cover the relative path as well as the absolute one: in CI the working
# directory is absolute, and a pattern anchored on ".venv" at the start no longer matches.
ignore-paths = ["(^|.*/)\\.venv/.*$"]

[tool.pylint.format]
max-line-length = 100

# The data access layer exposes one method per write, whose parameters mirror the
# columns of the table. The parameters after the first one are keyword-only, which
# keeps the calls readable despite their number.
[tool.pylint.design]
max-args = 8

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]
